name: Build TheTrefoil faithful static edition

on:
  push:
    branches: [main]
    paths:
      - 'site-export/**'
      - '.github/workflows/build-faithful-site.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: faithful-academic-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out homepage repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check out original TheTrefoil source
        uses: actions/checkout@v4
        with:
          repository: nawazcuj/TheTrefoil
          path: original
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public site renderer
        run: python -m pip install --disable-pip-version-check "jinja2>=3.1,<4" "beautifulsoup4>=4.12,<5" "lxml>=5,<7"
      - name: Render full public academic site
        env:
          TT_SOURCE_DIR: original
          TT_DEST: docs
        run: python site-export/build_static.py
      - name: Check site contents and internal assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit, unquote
          from bs4 import BeautifulSoup
          root=Path('docs')
          pages=list(root.rglob('index.html'))
          assert len(pages)>=60,f'Too few pages: {len(pages)}'
          for required in ['index.html','about/index.html','publication/index.html','course/index.html','note/index.html','resource/index.html','search/index.html','contact/index.html','static/css/style.css','static/css/homepage-editorial.css','static/media/TheTrefoil_3D_premium.mp4','static/js/tt-static-site.js']:
            assert (root/required).is_file(),f'Missing: {required}'
          assert not list(root.rglob('*.db')), 'Private database must not be published'
          errors=[]
          prefixes=('static/','about/','course/','publication/','note/','video/','project/','resource/','post/','person/','event/','cv/','contact/','search/')
          for file in pages:
            soup=BeautifulSoup(file.read_text(encoding='utf-8'),'lxml')
            for el in soup.find_all(True):
              for attr in ('href','src','poster'):
                raw=el.get(attr)
                if isinstance(raw,str) and raw.startswith(prefixes):
                  p=root/unquote(urlsplit(raw).path)
                  if not p.is_file() and not (p/'index.html').is_file():
                    errors.append(f'{file}: {raw}')
          assert not errors, '\n'.join(errors[:30])
          print(f'Validated {len(pages)} pages and all internal site assets.')
          PY
      - name: Commit independently verified static output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "Static output is already current."
          else
            git commit -m "Build faithful TheTrefoil public site from original source"
            git push origin HEAD:main
          fi
