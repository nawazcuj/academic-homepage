name: Publish faithful TheTrefoil academic site

on:
  push:
    branches: [main]
    paths:
      - 'site-export/**'
      - '.github/workflows/publish-faithful-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get static exporter and vetted public academic data
        uses: actions/checkout@v4
        with:
          path: site
      - name: Get original TheTrefoil public templates and assets
        uses: actions/checkout@v4
        with:
          repository: nawazcuj/TheTrefoil
          ref: main
          path: source
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install static rendering dependencies
        run: python -m pip install 'Jinja2>=3.1,<4' 'beautifulsoup4>=4.12,<5' 'lxml>=5,<7'
      - name: Render original site as 67 safe static pages
        env:
          TT_SOURCE_DIR: ${{ github.workspace }}/source
          TT_DEST: ${{ github.workspace }}/_site
        run: python site/site-export/build_static.py
      - name: Check generated homepage and private file exclusions
        shell: bash
        run: |
          test -s _site/index.html
          test -s _site/static/css/style.css
          test -s _site/static/css/homepage-editorial.css
          test -s _site/static/media/TheTrefoil_3D_premium.mp4
          test "$(find _site -name index.html | wc -l)" -ge 60
          test ! -e _site/instance
          test ! -e _site/.env
          test ! -e _site/app.py
          ! find _site -type f \( -name '*.db' -o -name '*.sqlite' -o -name '.env*' \) | grep .
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload built public site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
